<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>音浴の泉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0b1417;--bg2:#13242a;--fg:#e3eae5;--muted:#93a8a3;--faint:#62786f;--line:rgba(168,200,194,.18);--accent:#bdaee8;--err:#ef9a8a;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--fg);font-family:var(--body);
  display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
form{width:min(100%,340px);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.ring{width:84px;height:84px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);
  background:radial-gradient(circle at 38% 32%,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent) 6%,transparent) 70%);
  animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px color-mix(in srgb,var(--accent) 20%,transparent)}50%{box-shadow:0 0 42px color-mix(in srgb,var(--accent) 38%,transparent)}}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.9rem;letter-spacing:.16em;padding-left:.16em}
p{margin:0;color:var(--muted);font-size:.86rem}
input[type=password]{width:100%;font:inherit;font-size:1rem;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.84rem;cursor:pointer}
label input{accent-color:var(--accent);width:16px;height:16px}
button{font:inherit;font-size:.95rem;color:var(--fg);background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
  border-radius:999px;padding:10px 32px;cursor:pointer;letter-spacing:.1em}
button:disabled{opacity:.5;cursor:default}
#msg{min-height:1.4em;font-size:.82rem;color:var(--err)}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="ring" aria-hidden="true"></div>
  <h1>音浴の泉</h1>
  <p>あいことばを入れてください</p>
  <input type="password" id="pw" aria-label="あいことば" autocomplete="current-password" required>
  <label><input type="checkbox" id="keep">この端末で覚えておく</label>
  <button id="go">ひらく</button>
  <div id="msg" role="status"></div>
</form>

const KEY = 'on-yoku-izumi:aikotoba';
const $ = id => document.getElementById(id);
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(D.s), iterations:D.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(D.i)}, key, b(D.c));
  return new TextDecoder().decode(plain);
}
async function tryOpen(pw, silent){
  $('go').disabled = true; $('msg').textContent = silent ? '' : 'ひらいています…';
  try {
    const html = await open(pw);
    try { $('keep').checked ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch(e){}
    document.open(); document.write(html); document.close();
  } catch(e){
    try { if (silent) localStorage.removeItem(KEY); } catch(_){}
    $('go').disabled = false;
    $('msg').textContent = silent ? '' : 'あいことばがちがうようです';
    if (!silent){ $('pw').select(); }
  }
}
if (!window.crypto || !crypto.subtle){ $('msg').textContent = 'このブラウザではひらけません。https のアドレスで開いてください'; $('go').disabled = true; return; }
$('f').addEventListener('submit', e => { e.preventDefault(); const v = $('pw').value; if (v) tryOpen(v, false); });
let saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved){ $('keep').checked = true; tryOpen(saved, true); } else $('pw').focus();
})();
</script>
